<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wayfinder — __TITLE__</title>
<style>
:root{--bg:#0e1116;--panel:#161b23;--line:#262d38;--ink:#e6e9ef;--dim:#8b95a5;--acc:#5eead4;--acc2:#f59e0b;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:18px 24px 6px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:.3px}h1 b{color:var(--acc)}
header span{color:var(--dim)}
main{display:grid;grid-template-columns:minmax(300px,1fr) 340px;gap:18px;padding:12px 24px 28px;max-width:1280px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr;padding:12px 16px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{background:#1d2430;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer;font:inherit}
.tab.on{background:var(--acc);color:#04201c;border-color:var(--acc);font-weight:600}
.stage{position:relative;background:#0a0d12;border-radius:8px;overflow:hidden;line-height:0}
canvas{width:100%;height:auto;image-rendering:pixelated;display:block}
.ctl{display:flex;align-items:center;gap:10px;margin-top:12px}
.ctl button{background:var(--acc);color:#04201c;border:0;border-radius:8px;padding:7px 14px;font:600 13px inherit;cursor:pointer}
.ctl button.ghost{background:#1d2430;color:var(--ink);border:1px solid var(--line)}
input[type=range]{flex:1;accent-color:var(--acc)}
.ctl select{background:#1d2430;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}th{color:var(--dim);font-weight:500;font-size:12px}
tr.on td{color:var(--acc)}
.big{font-size:26px;font-weight:700;color:var(--acc)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px}.kv div:nth-child(odd){color:var(--dim)}
.bar{height:8px;border-radius:4px;background:#252d3a;margin:3px 0 9px;overflow:hidden}.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.side{display:flex;flex-direction:column;gap:14px}
.empty{color:var(--dim);padding:30px;text-align:center}
</style></head><body>
<header><h1><b>Wayfinder</b> replay</h1><span id="sub"></span></header>
<main>
 <section class="card">
  <div class="tabs" id="tabs"></div>
  <div class="stage"><canvas id="cv"></canvas></div>
  <div class="ctl">
   <button id="play">Play</button><button class="ghost" id="rst">Restart</button>
   <input type="range" id="scrub" min="0" max="0" value="0" aria-label="timeline">
   <select id="speed" aria-label="speed"><option value="1">1×</option><option value="4" selected>4×</option><option value="16">16×</option><option value="64">64×</option></select>
  </div>
  <div class="legend" id="legend"></div>
 </section>
 <aside class="side">
  <div class="card" id="stats"></div>
  <div class="card" id="table"></div>
 </aside>
</main>
<script>
const D=/*__DATA__*/null;
const $=id=>document.getElementById(id);
const W=D.w,H=D.h,S=Math.max(2,Math.min(14,Math.floor(900/Math.max(W,H))));
const cv=$('cv');cv.width=W*S;cv.height=H*S;const cx=cv.getContext('2d');
const TERR=['#05070a','#1b2230','#222c3b','#2a3a4a','#2c4650','#334f5a','#3b5a5f','#456a64','#4f7a6c','#5b8a73'];
const mode=[];D.algos.forEach((a,i)=>mode.push({kind:'algo',i,label:a.name}));
if(D.explore)mode.push({kind:'explore',label:'d* lite explore'});
let cur=0,t=0,playing=false,last=0;
const layer=document.createElement('canvas');layer.width=W*S;layer.height=H*S;const lx=layer.getContext('2d');let painted=0,paintedFor=-1;
$('sub').textContent=`${W}×${H} map · ${[...D.cost].filter(c=>c==='0').length} wall cells · start (${D.start}) → goal (${D.goal})`;
function tabs(){const el=$('tabs');el.innerHTML='';mode.forEach((m,i)=>{const b=document.createElement('button');b.className='tab'+(i===cur?' on':'');b.textContent=m.label;b.onclick=()=>{cur=i;t=0;playing=false;setup()};el.appendChild(b)})}
function total(){const m=mode[cur];if(!m)return 0;if(m.kind==='algo')return D.algos[m.i].order.length;return D.explore.trail.length-1}
function setup(){painted=0;paintedFor=-1;tabs();const n=total();$('scrub').max=n;$('scrub').value=t;$('play').textContent='Play';draw();stats()}
const bl=document.createElement('canvas');bl.width=W*S;bl.height=H*S;{const b=bl.getContext('2d');for(let y=0;y<H;y++)for(let x=0;x<W;x++){b.fillStyle=TERR[+D.cost[y*W+x]];b.fillRect(x*S,y*S,S,S)}}
function base(){cx.drawImage(bl,0,0)}
function cell(i,col){cx.fillStyle=col;cx.fillRect((i%W)*S,Math.floor(i/W)*S,S,S)}
function path(p,col,wd){if(!p||p.length<1)return;cx.strokeStyle=col;cx.lineWidth=wd;cx.lineJoin='round';cx.lineCap='round';cx.beginPath();p.forEach((q,k)=>{const X=q[0]*S+S/2,Y=q[1]*S+S/2;k?cx.lineTo(X,Y):cx.moveTo(X,Y)});cx.stroke()}
function marker(p,col,lab){const X=p[0]*S+S/2,Y=p[1]*S+S/2,r=Math.max(S*.9,5);cx.fillStyle=col;cx.beginPath();cx.arc(X,Y,r,0,7);cx.fill();cx.strokeStyle='#0008';cx.lineWidth=1.5;cx.stroke()}
function heat(k,n){const f=n<=1?0:k/(n-1);const h=190-f*150;return `hsl(${h} 70% ${28+f*14}%)`}
function draw(){
 cx.clearRect(0,0,cv.width,cv.height);base();const m=mode[cur];
 if(!m){cx.fillStyle='#889';cx.fillText('nothing to show',10,20);return}
 if(m.kind==='algo'){const a=D.algos[m.i],n=a.order.length;
  // expansions are painted incrementally onto an offscreen layer (O(new cells) per frame)
  if(paintedFor!==cur||t<painted){lx.clearRect(0,0,layer.width,layer.height);painted=0;paintedFor=cur}
  for(;painted<Math.min(t,n);painted++){const i=a.order[painted];lx.fillStyle=heat(painted,n);lx.fillRect((i%W)*S,Math.floor(i/W)*S,S,S)}
  cx.drawImage(layer,0,0);
  if(t>=n&&a.found){path(a.path,'#0008',S*.9+2);path(a.path,'#fbbf24',Math.max(2,S*.55))}
  else if(t>0&&t<n){const q=a.order[t-1];cell(q,'#fff')}
 } else {const E=D.explore,ev=E.events;
  const known=new Uint8Array(W*H).fill(1);const seen=new Uint8Array(W*H);
  // reveal: initial neighbourhood shows what the agent has perceived so far
  let evIdx=-1;for(let k=0;k<ev.length;k++){if(ev[k].step<=t)evIdx=k;}
  const fog=new Uint8Array(W*H);
  for(let k=0;k<=evIdx;k++)ev[k].found.forEach(q=>{fog[q[1]*W+q[0]]=1});
  // draw: walls/terrain only where discovered; unknown shown as a faint "assumed open"
  cx.clearRect(0,0,cv.width,cv.height);
  for(let i=0;i<W*H;i++){const x=i%W,y=(i/W)|0;const c=+D.cost[i];
    cx.fillStyle=fog[i]?TERR[c]:(c===0?'#11161e':'#141a23');cx.fillRect(x*S,y*S,S,S)}
  // ghost walls the agent has not discovered yet
  if(evIdx>=0){ev[evIdx].order.forEach(i=>cell(i,'rgba(94,234,212,.22)'))}
  const pl=evIdx>=0?ev[evIdx].plan:null;
  if(pl){path(pl,'#0008',S*.8+2);path(pl,'#fbbf24',Math.max(2,S*.45))}
  path(E.trail.slice(0,t+1),'#38bdf8',Math.max(2,S*.4));
  marker(E.trail[Math.min(t,E.trail.length-1)],'#38bdf8')}
 marker(D.start,'#22c55e');marker(D.goal,'#ef4444');
}
function stats(){const m=mode[cur],el=$('stats'),tb=$('table');
 const lg=$('legend');
 if(!m){el.innerHTML='<div class=empty>No traces in this file.</div>';tb.innerHTML='';lg.innerHTML='';return}
 if(m.kind==='algo'){const a=D.algos[m.i],n=a.order.length;const mx=Math.max(...D.algos.map(x=>x.expanded),1);
  el.innerHTML=`<h2>${a.name}</h2><div class="big">${a.found?a.cost.toFixed(3):'no path'}</div><div class="kv"><div>expansions shown</div><div>${Math.min(t,n)} / ${n}</div><div>nodes generated</div><div>${a.generated}</div><div>waypoints</div><div>${a.path.length}</div><div>wall time</div><div>${a.micros} µs</div></div>
  <div class="bar"><i style="width:${100*a.expanded/mx}%;background:var(--acc)"></i></div>`;
  tb.innerHTML=`<h2>All planners</h2><table><tr><th>algo</th><th>cost</th><th>expanded</th></tr>${D.algos.map((x,i)=>`<tr class="${i===m.i?'on':''}"><td>${x.name}</td><td>${x.found?x.cost.toFixed(2):'—'}</td><td>${x.expanded}</td></tr>`).join('')}</table>`;
  lg.innerHTML='<span><i style="background:hsl(190 70% 28%)"></i>expanded early</span><span><i style="background:hsl(40 70% 42%)"></i>expanded late</span><span><i style="background:#fbbf24"></i>path</span><span><i style="background:#22c55e"></i>start</span><span><i style="background:#ef4444"></i>goal</span>';
 } else {const E=D.explore;let evIdx=-1;E.events.forEach((e,k)=>{if(e.step<=t)evIdx=k});
  const ds=E.events.slice(0,evIdx+1).reduce((s,e)=>s+e.dstar,0),as=E.events.slice(0,evIdx+1).reduce((s,e)=>s+e.astar,0);
  const e=evIdx>=0?E.events[evIdx]:null;
  el.innerHTML=`<h2>D* Lite vs replanning from scratch</h2><div class="big">${as?(as/Math.max(ds,1)).toFixed(1)+'× less work':'—'}</div>
  <div class="kv"><div>sensor radius</div><div>${E.radius}</div><div>step</div><div>${t} / ${E.trail.length-1}</div><div>replans so far</div><div>${evIdx+1}</div><div>D* Lite expansions</div><div>${ds}</div><div>A* (from scratch) expansions</div><div>${as}</div><div>outcome</div><div>${E.reached?'reached goal':E.stuck?'goal unreachable':'incomplete'}</div><div>distance travelled</div><div>${E.travelled.toFixed(2)}</div></div>
  <div class="bar"><i style="width:${as?100*ds/Math.max(as,1):0}%;background:var(--acc)"></i></div><div class="bar"><i style="width:100%;background:var(--acc2)"></i></div>`;
  tb.innerHTML=`<h2>Replans</h2><table><tr><th>step</th><th>new</th><th>D*</th><th>A*</th></tr>${E.events.map((x,k)=>`<tr class="${k===evIdx?'on':''}"><td>${x.step}</td><td>${x.changed}</td><td>${x.dstar}</td><td>${x.astar}</td></tr>`).join('')}</table>`;
  lg.innerHTML='<span><i style="background:#38bdf8"></i>agent trail</span><span><i style="background:#fbbf24"></i>current plan</span><span><i style="background:rgba(94,234,212,.5)"></i>cells D* Lite re-expanded</span><span><i style="background:#141a23"></i>not yet perceived (assumed open; faint shading = hidden ground truth)</span>';
 }}
function tick(ts){if(playing){const sp=+$('speed').value;const n=total();
  if(ts-last>16){const m=mode[cur];const step=m&&m.kind==='explore'?Math.max(1,sp/8):Math.max(1,Math.ceil(n/600))*sp/4;t=Math.min(n,t+Math.max(1,Math.round(step)));last=ts;$('scrub').value=t;draw();stats();if(t>=n){playing=false;$('play').textContent='Play'}}}
 requestAnimationFrame(tick)}
$('play').onclick=()=>{if(t>=total())t=0;playing=!playing;$('play').textContent=playing?'Pause':'Play'};
$('rst').onclick=()=>{t=0;playing=false;$('scrub').value=0;$('play').textContent='Play';draw();stats()};
$('scrub').oninput=e=>{t=+e.target.value;draw();stats()};
setup();requestAnimationFrame(tick);
</script></body></html>
