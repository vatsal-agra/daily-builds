<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impulse — 2D Physics Sandbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b0e14'/%3E%3Cpolygon points='50,12 88,50 50,88 12,50' fill='%236ee7c8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">Impulse</span>
        <span class="brand-sub">a from-scratch 2D physics engine</span>
      </div>
      <div class="hud" id="hud">
        <span id="hud-bodies">0 bodies</span>
        <span class="dot">·</span>
        <span id="hud-fps">0 fps</span>
        <span class="dot">·</span>
        <span id="hud-status">running</span>
      </div>
    </header>

    <div class="workspace">
      <aside class="panel">
        <section class="group">
          <h2>Spawn</h2>
          <div class="tool-row" role="group" aria-label="Shape tool">
            <button class="tool-btn active" data-tool="circle" title="Circle">●</button>
            <button class="tool-btn" data-tool="box" title="Box">■</button>
            <button class="tool-btn" data-tool="grab" title="Grab / fling">✥</button>
          </div>
          <p class="hint">Drag on the canvas to spawn (size follows drag distance). Grab tool: click a body and drag to fling it.</p>
        </section>

        <section class="group">
          <h2>Material</h2>
          <label class="slider-row">
            <span>Bounciness</span>
            <input type="range" id="restitution" min="0" max="1" step="0.01" value="0.3">
            <output id="restitution-val">0.30</output>
          </label>
          <label class="slider-row">
            <span>Friction</span>
            <input type="range" id="friction" min="0" max="1.5" step="0.01" value="0.4">
            <output id="friction-val">0.40</output>
          </label>
        </section>

        <section class="group">
          <h2>World</h2>
          <label class="slider-row">
            <span>Gravity</span>
            <input type="range" id="gravity" min="-1000" max="1500" step="10" value="520">
            <output id="gravity-val">520</output>
          </label>
          <div class="btn-row">
            <button id="btn-pause">Pause</button>
            <button id="btn-step">Step</button>
            <button id="btn-reset">Reset</button>
          </div>
          <label class="check-row">
            <input type="checkbox" id="debug-toggle">
            <span>Debug overlay (contacts / normals)</span>
          </label>
        </section>

        <section class="group">
          <h2>Scenes</h2>
          <div class="btn-grid" id="scene-buttons"></div>
          <div class="btn-row">
            <button id="btn-export">Save scene…</button>
            <button id="btn-import">Load scene…</button>
          </div>
          <input type="file" id="file-import" accept="application/json" hidden>
        </section>
      </aside>

      <main class="canvas-wrap">
        <canvas id="canvas" width="900" height="600"></canvas>
        <div id="toast" class="toast" hidden></div>
      </main>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
