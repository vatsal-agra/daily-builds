<html>
<head><style>
body { font-family: sans-serif; }
.card { width: 300px; margin: 20px auto; padding: 16px; border: 2px solid #333; background-color: #f0f0f0; }
h1 { color: #222; }
p { line-height: 1.5; }
.right { text-align: right; }
.center { text-align: center; }
.justify { text-align: justify; }
</style></head>
<body>
<h1>Folio</h1>
<div class="card">
  <p>This is a paragraph of text long enough to wrap across multiple lines inside the card, so we can see the greedy word-wrapping line-breaker in action producing several line boxes.</p>
  <p class="right">Right aligned text here.</p>
  <p class="center">Centered text here.</p>
</div>
</body>
</html>
