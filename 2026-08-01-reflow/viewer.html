<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Reflow — pipeline visualizer</title>
<style>
  :root {
    --bg: #1e2127; --panel: #262a33; --panel2: #2c313c; --border: #3a3f4b;
    --text: #d8dee9; --muted: #8b92a5; --accent: #61afef; --accent2: #98c379;
    --mono: 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px; flex-shrink: 0;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: 0.5px; }
  header h1 .flow { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12.5px; }
  main { flex: 1; display: flex; overflow: hidden; }
  .editor-col {
    width: 340px; flex-shrink: 0; display: flex; flex-direction: column;
    border-right: 1px solid var(--border); padding: 14px; gap: 10px;
  }
  .editor-col label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin-bottom: -4px;
  }
  textarea {
    width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 10px;
    font-family: var(--mono); font-size: 12.5px; resize: none; flex: 1;
    line-height: 1.5;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  #htmlInput { flex: 3; min-height: 120px; }
  #cssInput { flex: 2; min-height: 90px; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .controls input[type=number] {
    width: 64px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
    font-family: var(--mono); font-size: 12px;
  }
  button {
    background: var(--accent); color: #1a1d22; border: none; border-radius: 6px;
    padding: 8px 16px; font-weight: 600; font-size: 13px; cursor: pointer;
    flex: 1;
  }
  button:hover { filter: brightness(1.08); }
  button:active { filter: brightness(0.95); }
  #status { font-size: 11.5px; color: var(--muted); min-height: 14px; }
  #status.error { color: #e06c75; }
  .grid {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr; gap: 1px; background: var(--border);
    overflow: hidden;
  }
  .pane { background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  .pane h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--border);
    flex-shrink: 0; background: var(--panel);
  }
  .pane .body { flex: 1; overflow: auto; padding: 10px 12px; }
  .pane pre {
    margin: 0; font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap;
    word-break: break-word; line-height: 1.45;
  }
  #layoutPane .body, #pngPane .body {
    display: flex; align-items: flex-start; justify-content: center; padding: 16px;
    background:
      linear-gradient(45deg, #2a2e37 25%, transparent 25%, transparent 75%, #2a2e37 75%),
      linear-gradient(45deg, #2a2e37 25%, transparent 25%, transparent 75%, #2a2e37 75%);
    background-color: #23262d;
    background-size: 16px 16px; background-position: 0 0, 8px 8px;
  }
  #layoutPane svg, #pngPane img { max-width: 100%; background: white; box-shadow: 0 0 0 1px #000; }
</style>
</head>
<body>
<header>
  <h1><span class="flow">Reflow</span> visualizer</h1>
  <div class="sub">HTML → DOM → CSSOM/cascade → layout → paint, all computed live by the real Python engine</div>
</header>
<main>
  <div class="editor-col">
    <label for="htmlInput">HTML</label>
    <textarea id="htmlInput" spellcheck="false"></textarea>
    <label for="cssInput">CSS (applied before the document's own &lt;style&gt;)</label>
    <textarea id="cssInput" spellcheck="false"></textarea>
    <div class="controls">
      <input type="number" id="widthInput" value="480" min="50" max="2000" title="viewport width">
      <button id="renderBtn">Render ▸</button>
    </div>
    <div id="status"></div>
  </div>
  <div class="grid">
    <div class="pane" id="domPane"><h2>DOM tree</h2><div class="body"><pre id="domOut"></pre></div></div>
    <div class="pane" id="cascadePane"><h2>CSSOM + cascade</h2><div class="body"><pre id="cascadeOut"></pre></div></div>
    <div class="pane" id="layoutPane"><h2>Layout boxes (SVG, real coordinates)</h2><div class="body" id="layoutOut"></div></div>
    <div class="pane" id="pngPane"><h2>Painted output (real PNG)</h2><div class="body" id="pngOut"></div></div>
  </div>
</main>
<script>
const SAMPLE_HTML = `<html>
<body>
  <h1>Welcome to Reflow</h1>
  <div class="card">
    <p>A from-scratch browser engine: HTML, CSS cascade, layout, and paint.</p>
    <p>A <span class="highlight">highlighted</span> word sits inline here.</p>
  </div>
  <p id="footer">rendered by the real Python engine</p>
</body>
</html>`;

const SAMPLE_CSS = `body { margin: 16px; }
.card { border: 3px solid navy; background-color: lightblue; padding: 12px; width: 320px; }
.highlight { color: crimson; }
#footer { text-align: center; color: gray; }`;

const htmlInput = document.getElementById('htmlInput');
const cssInput = document.getElementById('cssInput');
const widthInput = document.getElementById('widthInput');
const status = document.getElementById('status');

htmlInput.value = SAMPLE_HTML;
cssInput.value = SAMPLE_CSS;

async function render() {
  status.textContent = 'rendering...';
  status.className = '';
  try {
    const resp = await fetch('/render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        html: htmlInput.value,
        css: cssInput.value,
        width: parseInt(widthInput.value, 10) || 480,
      }),
    });
    const data = await resp.json();
    if (!resp.ok || data.error) {
      status.textContent = 'error: ' + (data.error || resp.statusText);
      status.className = 'error';
      return;
    }
    document.getElementById('domOut').textContent = data.dom_text;
    document.getElementById('cascadeOut').textContent = data.cssom_text + '\n\n--- cascade per element ---\n\n' + data.cascade_text;
    document.getElementById('layoutOut').innerHTML = data.layout_svg;
    document.getElementById('pngOut').innerHTML =
      '<img src="data:image/png;base64,' + data.png_base64 + '" alt="rendered page">';
    status.textContent = `ok — ${data.width}×${data.height}px`;
  } catch (e) {
    status.textContent = 'request failed: ' + e;
    status.className = 'error';
  }
}

document.getElementById('renderBtn').addEventListener('click', render);
[htmlInput, cssInput, widthInput].forEach(el => {
  el.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') render();
  });
});

render();
</script>
</body>
</html>
