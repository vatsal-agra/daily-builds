<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nonce — live block explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0b0e14;
    --panel: #121620;
    --panel-2: #171c29;
    --border: #262c3c;
    --text: #e6e9f2;
    --muted: #8891a7;
    --accent: #f7931a;   /* proof-of-work orange */
    --accent-dim: #7a4d10;
    --green: #37c977;
    --red: #f3546b;
    --blue: #5b9dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 10% -10%, #17203a 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    min-height: 100vh;
  }
  .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: rgba(11,14,20,0.9); backdrop-filter: blur(6px); z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 10px; }
  header h1 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .stat-row { display: flex; gap: 22px; font-size: 13px; color: var(--muted); }
  .stat-row b { color: var(--text); }
  main { padding: 22px 28px 60px; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 20px; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 18px;
  }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  #partition-banner {
    display: none; background: linear-gradient(90deg, #3a1420, #241018); border: 1px solid #7a2438;
    color: #ff8fa3; padding: 10px 14px; border-radius: 10px; margin-bottom: 18px; font-size: 13px;
    grid-column: 1 / -1;
  }
  #partition-banner.show { display: block; }
  .node-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
  .node {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    position: relative; overflow: hidden;
  }
  .node.minority { border-color: var(--red); box-shadow: 0 0 0 1px rgba(243,84,107,.25) inset; }
  .node .id { font-weight: 600; font-size: 14px; display:flex; align-items:center; gap:6px; }
  .node .addr { font-size: 10px; color: var(--muted); margin-top: 2px; word-break: break-all; }
  .node .row { display: flex; justify-content: space-between; font-size: 12px; margin-top: 6px; color: var(--muted); }
  .node .row b { color: var(--text); font-weight: 500; }
  .badge { font-size: 9px; padding: 1px 6px; border-radius: 20px; border: 1px solid var(--border); }
  .badge.ok { color: var(--green); border-color: rgba(55,201,119,.4); }
  .badge.bad { color: var(--red); border-color: rgba(243,84,107,.4); }

  .block { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: var(--panel-2); overflow: hidden; }
  .block-head { display: flex; align-items: center; gap: 14px; padding: 10px 14px; cursor: pointer; }
  .block-head:hover { background: #1b2131; }
  .block-height { background: var(--accent-dim); color: var(--accent); font-weight: 700; font-size: 12px; padding: 3px 9px; border-radius: 7px; min-width: 34px; text-align: center; }
  .block-hash { color: var(--blue); font-size: 12.5px; flex: 1; }
  .block-meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .block-body { padding: 0 14px 12px; display: none; border-top: 1px dashed var(--border); }
  .block.open .block-body { display: block; }
  .tx { font-size: 11.5px; padding: 7px 0; border-bottom: 1px solid #1e2434; }
  .tx:last-child { border-bottom: none; }
  .tx .txid { color: var(--muted); }
  .tx .cb { color: var(--accent); font-weight: 600; }
  .tx .out { color: var(--green); margin-left: 8px; }

  #events { max-height: 620px; overflow-y: auto; display: flex; flex-direction: column-reverse; }
  .ev { font-size: 12px; padding: 5px 0; border-bottom: 1px solid #1c2130; color: var(--muted); }
  .ev .tick { color: var(--accent); margin-right: 8px; }
  .ev.warn { color: var(--red); }
  .ev.reorg { color: var(--blue); }

  #blocks-panel .card { max-height: 760px; overflow-y: auto; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a3145; border-radius: 8px; }
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span> Nonce <span style="color:var(--muted); font-weight:400;">— live block explorer</span></h1>
  <div class="stat-row mono">
    <div>tick <b id="s-tick">–</b></div>
    <div>height <b id="s-height">–</b></div>
    <div>supply <b id="s-supply">–</b> NCE</div>
    <div>bits <b id="s-bits">–</b></div>
  </div>
</header>

<main>
  <div id="partition-banner"></div>

  <div id="left">
    <div class="card">
      <h2>Nodes</h2>
      <div id="nodes" class="node-grid"></div>
    </div>

    <div id="blocks-panel" class="card">
      <h2>Chain (majority tip, newest first)</h2>
      <div id="blocks"></div>
    </div>
  </div>

  <div class="card" style="align-self: start;">
    <h2>Network log</h2>
    <div id="events"></div>
  </div>
</main>

<script>
const fmt = (sats) => (sats / 1e8).toFixed(4);
const short = (h) => h.slice(0, 14) + '…';

function render(state) {
  document.getElementById('s-tick').textContent = state.tick;
  document.getElementById('s-height').textContent = state.blocks.length ? state.blocks[0].height : 0;
  document.getElementById('s-supply').textContent = fmt(state.total_supply);
  document.getElementById('s-bits').textContent = state.difficulty_bits;

  const banner = document.getElementById('partition-banner');
  if (state.partitioned) {
    banner.classList.add('show');
    banner.textContent = '⚠ network partitioned — nodes are mining on independent forks';
  } else {
    banner.classList.remove('show');
  }

  const nodesEl = document.getElementById('nodes');
  nodesEl.innerHTML = state.nodes.map(n => `
    <div class="node ${n.on_majority_chain ? '' : 'minority'}">
      <div class="id">${n.id} <span class="badge ${n.on_majority_chain ? 'ok' : 'bad'}">${n.on_majority_chain ? 'majority' : 'forked'}</span></div>
      <div class="addr mono">${n.address ? n.address.slice(0,18)+'…' : ''}</div>
      <div class="row"><span>height</span><b>${n.height}</b></div>
      <div class="row"><span>balance</span><b>${fmt(n.balance)}</b></div>
      <div class="row"><span>mempool</span><b>${n.mempool}</b></div>
    </div>
  `).join('');

  const openSet = new Set([...document.querySelectorAll('.block.open')].map(e => e.dataset.hash));
  const blocksEl = document.getElementById('blocks');
  blocksEl.innerHTML = state.blocks.map(b => `
    <div class="block ${openSet.has(b.hash) ? 'open' : ''}" data-hash="${b.hash}">
      <div class="block-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="block-height">#${b.height}</div>
        <div class="block-hash mono">${short(b.hash)}</div>
        <div class="block-meta mono">${b.tx_count} tx · nonce ${b.nonce} · ${b.bits}</div>
      </div>
      <div class="block-body">
        ${b.txs.map(tx => `
          <div class="tx mono">
            ${tx.coinbase ? '<span class="cb">COINBASE</span>' : `<span class="txid">${short(tx.txid)}</span> (${tx.inputs} in)`}
            ${tx.outputs.map(o => `<span class="out">→ ${fmt(o.amount)} to ${short(o.to)}</span>`).join('')}
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');

  const eventsEl = document.getElementById('events');
  eventsEl.innerHTML = state.events.map(e => {
    const cls = e.text.includes('PARTITION') || e.text.includes('STILL DIVERGENT') ? 'warn'
              : e.text.includes('reorg') || e.text.includes('resynced') ? 'reorg' : '';
    return `<div class="ev ${cls}"><span class="tick mono">#${e.tick}</span>${e.text}</div>`;
  }).join('');
}

async function poll() {
  try {
    const res = await fetch('/api/state');
    const state = await res.json();
    render(state);
  } catch (e) {
    console.error(e);
  } finally {
    setTimeout(poll, 500);
  }
}
poll();
</script>
</body>
</html>
