<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: monospace; font-size: 16px; }
.wrap { width: 400px; border: 1px solid black; }
.left { text-align: left; }
.center { text-align: center; }
.right { text-align: right; }
.justify { text-align: justify; }
p { line-height: 1.5; }
</style></head>
<body>
<div class="wrap left" id="p-left">
  <p id="text-left">The quick brown fox jumps over the lazy dog while the sun sets slowly behind the hills in the distance.</p>
</div>
<div class="wrap center" id="p-center">
  <p id="text-center">Short centered line</p>
</div>
<div class="wrap right" id="p-right">
  <p id="text-right">Right aligned text here</p>
</div>
<div class="wrap justify" id="p-justify">
  <p id="text-justify">This paragraph is justified so that each line except the last stretches to fill the full width of its container box.</p>
</div>
</body></html>
