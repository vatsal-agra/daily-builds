<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: content-box; }
body { font-family: sans-serif; }
.a { width: 300px; height: 100px; padding: 20px; border: 5px solid black; background: #eee; }
.b { width: 200px; height: 50px; box-sizing: border-box; padding: 10px; border: 3px solid blue; margin-top: 15px; }
.c { width: 50%; height: 40px; background: red; margin-top: 10px; }
.nested { width: 100px; height: 30px; background: green; margin: 5px; }
</style></head>
<body>
<div class="a" id="box-a">
  <div class="nested" id="nested-1"></div>
</div>
<div class="b" id="box-b"></div>
<div class="c" id="box-c"></div>
</body></html>
