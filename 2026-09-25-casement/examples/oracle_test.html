<!DOCTYPE html>
<html>
<head>
<style>
  * { font-family: monospace; }
  body { margin: 0; }
  .box-model { width: 300px; height: 100px; margin: 20px; padding: 15px; border: 5px solid black; background: #eef; }
  .row { display: flex; width: 400px; height: 80px; }
  .row .a { flex: 1; height: 40px; }
  .row .b { flex: 2; height: 40px; }
  .wrap-row { display: flex; flex-wrap: wrap; width: 200px; }
  .wrap-row .item { width: 90px; height: 30px; margin: 5px; }
  .centered { display: flex; justify-content: center; align-items: center; width: 300px; height: 150px; }
  .centered .inner { width: 50px; height: 50px; }
  .abs-container { position: relative; width: 300px; height: 200px; }
  .abs-child { position: absolute; top: 20px; left: 40px; width: 60px; height: 60px; }
  .percent { width: 500px; }
  .percent .half { width: 50%; height: 20px; display: inline-block; }
  .nested-box { width: 200px; padding: 10px; border: 2px solid red; }
  .nested-box .inner-box { width: 100%; height: 30px; box-sizing: border-box; padding: 5px; border: 3px solid blue; }
</style>
</head>
<body>
  <div class="box-model"></div>
  <div class="row"><div class="a"></div><div class="b"></div></div>
  <div class="wrap-row">
    <div class="item"></div><div class="item"></div><div class="item"></div>
  </div>
  <div class="centered"><div class="inner"></div></div>
  <div class="abs-container"><div class="abs-child"></div></div>
  <div class="percent"><div class="half"></div><div class="half"></div></div>
  <div class="nested-box"><div class="inner-box"></div></div>
</body>
</html>
