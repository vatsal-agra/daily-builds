<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<title>Zugzwang</title>
<style>
  :root {
    --light-sq: #ebd9b7;
    --dark-sq: #7a5c3e;
    --accent: #b5895a;
    --bg: #1c1a17;
    --panel: #262320;
    --panel-border: #3a352e;
    --text: #ece6da;
    --text-dim: #a89d8a;
    --highlight-from: rgba(255, 214, 92, 0.55);
    --highlight-to: rgba(255, 214, 92, 0.35);
    --legal-dot: rgba(60, 40, 20, 0.55);
    --legal-capture: rgba(190, 60, 45, 0.55);
    --check: rgba(220, 50, 40, 0.65);
    --good: #7fbf7f;
    --bad: #d97a6c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  .app {
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    justify-content: center;
    align-items: flex-start;
    padding: 32px 20px;
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 4px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 .glyph { font-size: 1.6rem; }
  .subtitle {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .board-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .board-wrap {
    position: relative;
    width: min(88vw, 520px);
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 6px #14120f, 0 0 0 8px #423424;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 100%;
    height: 100%;
  }
  .sq {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(8vw, 46px);
    user-select: none;
    cursor: pointer;
    transition: filter 0.1s;
  }
  .sq.light { background: var(--light-sq); }
  .sq.dark { background: var(--dark-sq); }
  .sq:hover { filter: brightness(1.08); }
  .sq .piece {
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.45));
    pointer-events: none;
    line-height: 1;
  }
  .sq .piece.white { color: #fbf6ec; }
  .sq .piece.black { color: #1c1712; }
  .sq.from::after, .sq.to::after {
    content: ""; position: absolute; inset: 0;
    background: var(--highlight-from);
  }
  .sq.to::after { background: var(--highlight-to); }
  .sq.check::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle, var(--check) 0%, transparent 72%);
  }
  .sq .dot {
    position: absolute;
    width: 26%; height: 26%;
    border-radius: 50%;
    background: var(--legal-dot);
    pointer-events: none;
  }
  .sq .ring {
    position: absolute;
    inset: 6%;
    border-radius: 50%;
    border: 5px solid var(--legal-capture);
    pointer-events: none;
    box-sizing: border-box;
  }
  .sq.selected { outline: 3px solid #ffd65c; outline-offset: -3px; z-index: 2; }
  .coords {
    position: absolute;
    font-size: 10px;
    opacity: 0.55;
    pointer-events: none;
  }
  .coords.file { bottom: 2px; right: 4px; }
  .coords.rank { top: 2px; left: 4px; }
  .sq.light .coords { color: var(--dark-sq); }
  .sq.dark .coords { color: var(--light-sq); }

  .status-bar {
    width: min(88vw, 520px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
    color: var(--text-dim);
  }
  .status-bar .turn { color: var(--text); font-weight: 600; }
  .status-bar .badge {
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    font-size: 0.8rem;
  }
  .badge.thinking { color: #ffd65c; border-color: #6b5a2a; }
  .badge.over { color: var(--bad); border-color: #6b3a34; }
  .badge.check { color: var(--check); border-color: #6b3a34; }

  .game-over-banner {
    width: min(88vw, 520px);
    text-align: center;
    padding: 10px 14px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    background: linear-gradient(180deg, #3a2420, #2c1a17);
    border: 1px solid #6b3a34;
    color: #f2c9c0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  }
  .game-over-banner[hidden] { display: none; }

  .capture-tray {
    width: min(88vw, 520px);
    min-height: 22px;
    display: flex;
    flex-wrap: wrap;
    gap: 1px;
    font-size: 1.1rem;
    line-height: 1;
    color: var(--text-dim);
    opacity: 0.85;
  }
  .capture-tray .cap-piece.white { color: #fbf6ec; text-shadow: 0 1px 1px rgba(0,0,0,0.5); }
  .capture-tray .cap-piece.black { color: #1c1712; text-shadow: 0 1px 1px rgba(255,255,255,0.15); }
  .capture-tray .cap-material {
    margin-left: 6px;
    font-size: 0.7rem;
    align-self: center;
    color: var(--good);
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }

  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    width: min(88vw, 520px);
  }
  button, select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover:not(:disabled) { background: #322d27; border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  select { cursor: pointer; }

  .side-panel {
    width: 320px;
    max-width: 88vw;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel-box {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .panel-box h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 0 0 10px 0;
  }
  .moves-list {
    max-height: 260px;
    overflow-y: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.85rem;
    line-height: 1.9;
  }
  .moves-list .row { display: flex; gap: 8px; }
  .moves-list .num { color: var(--text-dim); width: 26px; flex: none; }
  .moves-list .mv { flex: 1; }
  .engine-info {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.8rem;
    color: var(--text-dim);
    white-space: pre-wrap;
  }
  textarea {
    width: 100%;
    min-height: 90px;
    background: #14120f;
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.75rem;
    padding: 8px;
    resize: vertical;
  }
  .row-buttons { display: flex; gap: 8px; margin-top: 8px; }
  .footer-note { color: var(--text-dim); font-size: 0.72rem; line-height: 1.5; }
  .msg { font-size: 0.8rem; margin-top: 6px; min-height: 1.2em; }
  .msg.error { color: var(--bad); }
  .msg.ok { color: var(--good); }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2ede2;
      --panel: #fffdf8;
      --panel-border: #ddd3bf;
      --text: #2a2621;
      --text-dim: #736a5c;
    }
  }
</style>
</head>
<body>
<div class="app">
  <div class="board-column">
    <h1><span class="glyph">♞</span> Zugzwang</h1>
    <div class="subtitle">a from-scratch chess engine — click a piece, then a highlighted square</div>
    <div class="status-bar">
      <div class="turn" id="turnLabel">White to move</div>
      <div class="badge" id="statusBadge">ready</div>
    </div>
    <div class="game-over-banner" id="gameOverBanner" hidden></div>
    <div class="capture-tray" id="capturedTop" aria-label="pieces Black has captured"></div>
    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>
    <div class="capture-tray" id="capturedBottom" aria-label="pieces White has captured"></div>
    <div class="controls">
      <select id="sideSelect">
        <option value="white">Play as White</option>
        <option value="black">Play as Black</option>
      </select>
      <select id="timeSelect">
        <option value="1">Engine: 1s</option>
        <option value="2" selected>Engine: 2s</option>
        <option value="4">Engine: 4s</option>
        <option value="8">Engine: 8s</option>
      </select>
      <button id="newGameBtn">New game</button>
      <button id="engineMoveBtn">Force engine move</button>
      <button id="flipBtn">Flip board</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="side-panel">
    <div class="panel-box">
      <h2>Move list</h2>
      <div class="moves-list" id="movesList">&mdash;</div>
    </div>
    <div class="panel-box">
      <h2>Engine</h2>
      <div class="engine-info" id="engineInfo">no move yet</div>
    </div>
    <div class="panel-box">
      <h2>PGN</h2>
      <textarea id="pgnBox" spellcheck="false" placeholder="Load a PGN here and click Load to replay it, or click Export to fill this box with the current game."></textarea>
      <div class="row-buttons">
        <button id="exportBtn">Export current game</button>
        <button id="loadBtn">Load &amp; replay</button>
      </div>
    </div>
    <div class="footer-note">
      Every legal move, evaluation, and engine reply comes from the real
      Python engine over a local JSON API — nothing here is a mock.
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const PIECE_GLYPH = {
    P: "♙", N: "♘", B: "♗", R: "♖", Q: "♕", K: "♔",
    p: "♟", n: "♞", b: "♝", r: "♜", q: "♛", k: "♚",
  };
  const FILES = "abcdefgh";

  let state = null;
  let selected = null;       // square name like "e2"
  let legalTargets = [];     // [{to, capture, promotion}]
  let flipped = false;
  let busy = false;

  const boardEl = document.getElementById("board");
  const turnLabel = document.getElementById("turnLabel");
  const statusBadge = document.getElementById("statusBadge");
  const movesList = document.getElementById("movesList");
  const engineInfo = document.getElementById("engineInfo");
  const msgEl = document.getElementById("msg");
  const sideSelect = document.getElementById("sideSelect");
  const timeSelect = document.getElementById("timeSelect");
  const gameOverBanner = document.getElementById("gameOverBanner");
  const capturedTopEl = document.getElementById("capturedTop");
  const capturedBottomEl = document.getElementById("capturedBottom");

  const STARTING_COUNTS = { P: 8, N: 2, B: 2, R: 2, Q: 1 };
  const PIECE_VALUE = { P: 1, N: 3, B: 3, R: 5, Q: 9 };
  const CAPTURE_ORDER = ["Q", "R", "B", "N", "P"];

  function squareName(file, rank) { return FILES[file] + (rank + 1); }

  function renderCaptureTrays(grid) {
    const onBoard = { w: {}, b: {} };
    for (const piece of Object.values(grid)) {
      const color = piece === piece.toUpperCase() ? "w" : "b";
      const kind = piece.toUpperCase();
      if (kind === "K") continue;
      onBoard[color][kind] = (onBoard[color][kind] || 0) + 1;
    }
    let whiteMaterial = 0, blackMaterial = 0;
    const capturedWhite = []; // white pieces that are missing -> Black captured them
    const capturedBlack = [];
    for (const kind of CAPTURE_ORDER) {
      const startCount = STARTING_COUNTS[kind];
      const wOnBoard = onBoard.w[kind] || 0;
      const bOnBoard = onBoard.b[kind] || 0;
      whiteMaterial += wOnBoard * PIECE_VALUE[kind];
      blackMaterial += bOnBoard * PIECE_VALUE[kind];
      for (let i = 0; i < startCount - wOnBoard; i++) capturedWhite.push(kind);
      for (let i = 0; i < startCount - bOnBoard; i++) capturedBlack.push(kind.toLowerCase());
    }

    const renderTray = (el, captured, materialDiff) => {
      el.innerHTML = "";
      for (const p of captured) {
        const span = document.createElement("span");
        span.className = "cap-piece " + (p === p.toUpperCase() ? "white" : "black");
        span.textContent = PIECE_GLYPH[p];
        el.appendChild(span);
      }
      if (materialDiff > 0) {
        const tag = document.createElement("span");
        tag.className = "cap-material";
        tag.textContent = `+${materialDiff}`;
        el.appendChild(tag);
      }
    };
    // top tray = captured WHITE pieces (Black's captures), shown with Black's material lead
    renderTray(capturedTopEl, capturedWhite, blackMaterial - whiteMaterial);
    renderTray(capturedBottomEl, capturedBlack, whiteMaterial - blackMaterial);
  }

  function fenToGrid(fen) {
    const placement = fen.split(" ")[0];
    const rows = placement.split("/"); // rank8 .. rank1
    const grid = {}; // "e4" -> "P"/"p"/...
    rows.forEach((row, i) => {
      const rank = 7 - i;
      let file = 0;
      for (const ch of row) {
        if (/\d/.test(ch)) {
          file += parseInt(ch, 10);
        } else {
          grid[squareName(file, rank)] = ch;
          file += 1;
        }
      }
    });
    return grid;
  }

  function buildBoard() {
    boardEl.innerHTML = "";
    for (let displayRow = 0; displayRow < 8; displayRow++) {
      for (let displayCol = 0; displayCol < 8; displayCol++) {
        const rank = flipped ? displayRow : 7 - displayRow;
        const file = flipped ? 7 - displayCol : displayCol;
        const name = squareName(file, rank);
        const sq = document.createElement("div");
        sq.className = "sq " + (((file + rank) % 2 === 1) ? "light" : "dark");
        sq.dataset.square = name;
        if (displayRow === 7) {
          const c = document.createElement("div");
          c.className = "coords file";
          c.textContent = FILES[file];
          sq.appendChild(c);
        }
        if (displayCol === 0) {
          const c = document.createElement("div");
          c.className = "coords rank";
          c.textContent = String(rank + 1);
          sq.appendChild(c);
        }
        sq.addEventListener("click", () => onSquareClick(name));
        boardEl.appendChild(sq);
      }
    }
  }

  function render() {
    if (!state) return;
    const grid = fenToGrid(state.fen);
    const kingSquare = findKingSquare(grid, state.to_move);

    document.querySelectorAll(".sq").forEach((sq) => {
      const name = sq.dataset.square;
      sq.classList.remove("from", "to", "selected", "check");
      const existingPiece = sq.querySelector(".piece");
      if (existingPiece) existingPiece.remove();
      sq.querySelectorAll(".dot,.ring").forEach((n) => n.remove());

      const piece = grid[name];
      if (piece) {
        const span = document.createElement("span");
        span.className = "piece " + (piece === piece.toUpperCase() ? "white" : "black");
        span.textContent = PIECE_GLYPH[piece];
        sq.appendChild(span);
      }

      if (state.last_move) {
        const from = state.last_move.slice(0, 2);
        const to = state.last_move.slice(2, 4);
        if (name === from) sq.classList.add("from");
        if (name === to) sq.classList.add("to");
      }
      if (state.in_check && name === kingSquare) sq.classList.add("check");
      if (name === selected) sq.classList.add("selected");
    });

    for (const t of legalTargets) {
      const sq = boardEl.querySelector(`.sq[data-square="${t.to}"]`);
      if (!sq) continue;
      const marker = document.createElement("div");
      marker.className = t.capture ? "ring" : "dot";
      sq.appendChild(marker);
    }

    const turnName = state.to_move === "white" ? "White" : "Black";
    turnLabel.textContent = state.game_over ? (state.message || "Game over") : `${turnName} to move`;

    statusBadge.className = "badge";
    if (state.game_over) {
      statusBadge.textContent = "game over";
      statusBadge.classList.add("over");
    } else if (state.in_check) {
      statusBadge.textContent = "check";
      statusBadge.classList.add("check");
    } else if (busy) {
      statusBadge.textContent = "thinking…";
      statusBadge.classList.add("thinking");
    } else {
      statusBadge.textContent = state.to_move === state.human_color ? "your move" : "engine's move";
    }

    renderCaptureTrays(grid);

    if (state.game_over) {
      gameOverBanner.hidden = false;
      const resultGlyph = state.state === "checkmate" ? "♚✕" : "½–½";
      gameOverBanner.textContent = `${resultGlyph}  ${state.message || "Game over"}`;
    } else {
      gameOverBanner.hidden = true;
    }

    renderMoveList();
    renderEngineInfo();
  }

  function findKingSquare(grid, toMoveColor) {
    const target = toMoveColor === "white" ? "K" : "k";
    for (const [sq, p] of Object.entries(grid)) if (p === target) return sq;
    return null;
  }

  function renderMoveList() {
    if (!state.san_history.length) {
      movesList.innerHTML = "&mdash;";
      return;
    }
    let html = "";
    for (let i = 0; i < state.san_history.length; i += 2) {
      const num = i / 2 + 1;
      const white = state.san_history[i] || "";
      const black = state.san_history[i + 1] || "";
      html += `<div class="row"><div class="num">${num}.</div><div class="mv">${white}</div><div class="mv">${black}</div></div>`;
    }
    movesList.innerHTML = html;
    movesList.scrollTop = movesList.scrollHeight;
  }

  function renderEngineInfo() {
    const info = state.engine_info;
    if (!info) { engineInfo.textContent = "no move yet"; return; }
    if (info.source === "book") {
      engineInfo.textContent = "played from opening book";
    } else {
      const cp = (info.score / 100).toFixed(2);
      engineInfo.textContent =
        `depth ${info.depth}\neval ${cp > 0 ? "+" : ""}${cp}\n${info.nodes.toLocaleString()} nodes searched`;
    }
  }

  function showMsg(text, kind) {
    msgEl.textContent = text || "";
    msgEl.className = "msg" + (kind ? " " + kind : "");
  }

  async function api(path, opts) {
    const res = await fetch(path, opts);
    let body;
    try { body = await res.json(); } catch (e) { body = { error: "bad response from server" }; }
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    return body;
  }

  async function refreshState() {
    state = await api("/api/state");
    render();
  }

  async function maybeEngineMove() {
    if (!state || state.game_over) return;
    if (state.to_move === state.human_color) return;
    busy = true;
    render();
    try {
      state = await api("/api/engine_move", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    } catch (e) {
      showMsg(e.message, "error");
    } finally {
      busy = false;
      render();
    }
  }

  async function onSquareClick(name) {
    if (!state || state.game_over || busy) return;
    if (state.to_move !== state.human_color) return;

    if (selected && legalTargets.some((t) => t.to === name)) {
      const target = legalTargets.find((t) => t.to === name);
      let uci = selected + name;
      if (target.promotion) {
        const choice = (prompt("Promote to (q, r, b, n)?", "q") || "q").toLowerCase();
        uci += "qrbn".includes(choice) ? choice : "q";
      }
      selected = null;
      legalTargets = [];
      busy = true;
      render();
      try {
        state = await api("/api/move", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ uci }),
        });
        showMsg("");
      } catch (e) {
        showMsg(e.message, "error");
      }
      busy = false;
      render();
      await maybeEngineMove();
      return;
    }

    const grid = fenToGrid(state.fen);
    const piece = grid[name];
    const isOwn = piece && (state.to_move === "white" ? piece === piece.toUpperCase() : piece === piece.toLowerCase());
    if (!isOwn) {
      selected = null;
      legalTargets = [];
      render();
      return;
    }
    selected = name;
    try {
      const resp = await api(`/api/moves?square=${name}`);
      legalTargets = resp.moves;
    } catch (e) {
      legalTargets = [];
    }
    render();
  }

  document.getElementById("newGameBtn").addEventListener("click", async () => {
    busy = true;
    showMsg("");
    render();
    try {
      state = await api("/api/new", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ human_color: sideSelect.value, think_time: parseFloat(timeSelect.value) }),
      });
      selected = null;
      legalTargets = [];
    } catch (e) {
      showMsg(e.message, "error");
    }
    busy = false;
    render();
    await maybeEngineMove();
  });

  document.getElementById("engineMoveBtn").addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    render();
    try {
      state = await api("/api/engine_move", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    } catch (e) {
      showMsg(e.message, "error");
    }
    busy = false;
    render();
  });

  document.getElementById("flipBtn").addEventListener("click", () => {
    flipped = !flipped;
    buildBoard();
    render();
  });

  document.getElementById("exportBtn").addEventListener("click", async () => {
    try {
      const resp = await api("/api/pgn");
      document.getElementById("pgnBox").value = resp.pgn;
      showMsg("Exported.", "ok");
    } catch (e) {
      showMsg(e.message, "error");
    }
  });

  document.getElementById("loadBtn").addEventListener("click", async () => {
    const pgn = document.getElementById("pgnBox").value.trim();
    if (!pgn) { showMsg("Paste a PGN first.", "error"); return; }
    busy = true;
    render();
    try {
      state = await api("/api/load_pgn", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pgn }),
      });
      selected = null;
      legalTargets = [];
      showMsg("Loaded.", "ok");
    } catch (e) {
      showMsg(e.message, "error");
    }
    busy = false;
    render();
  });

  buildBoard();
  refreshState().then(maybeEngineMove).catch((e) => showMsg(e.message, "error"));
})();
</script>
</body>
